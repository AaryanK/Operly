name: react-frontend-foundation

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "apps/api/main.py"
      - "apps/api/personal_agent_router.py"
      - "packages/business_brain/personal_agent.py"
      - "packages/email/templates/**"
      - "apps/web/index.html"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "apps/web/vite.config.ts"
      - "apps/web/src/**"
      - "apps/web/public/**"
      - "apps/web/scripts/**"
      - "apps/web/FRONTEND_MIGRATION.md"
      - "docs/legal/**"
      - ".github/workflows/react-frontend-foundation.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Verify frontend convergence contracts
        working-directory: apps/web
        run: npm run test:contracts
      - name: Build canonical React frontend
        working-directory: apps/web
        run: npm run build
      - name: Verify authenticated route splitting
        working-directory: apps/web
        run: npm run test:bundle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python serving and frontend build helpers
        run: python -m py_compile apps/api/main.py apps/api/personal_agent_router.py packages/business_brain/personal_agent.py apps/web/scripts/optimize_logo.py apps/web/scripts/viewport_smoke.py
      - name: Install Chromium viewport smoke dependency
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify responsive surfaces in Chromium
        working-directory: apps/web
        run: python scripts/viewport_smoke.py
      - name: Assert production image includes the frontend build stage
        run: |
          grep -q 'FROM node:22-alpine AS web-build' Dockerfile
          grep -q 'COPY --from=web-build /web/dist /app/apps/web/dist' Dockerfile
          grep -q 'optimize_logo.py' Dockerfile
          grep -q 'route.startswith("channels/")' apps/api/main.py
      - name: Verify canonical route ownership has no migration placeholders
        run: |
          ! test -d apps/web/static
          ! grep -R 'PendingMigration' apps/web/src
          ! grep -R 'hiddenClick' apps/web/src
          ! grep -R 'MutationObserver' apps/web/src
          grep -q 'WorkspaceOperly' apps/web/src/workspace/WorkspaceShell.tsx
          grep -q 'CRMPage' apps/web/src/workspace/WorkspaceShell.tsx
          grep -q 'AccessPage' apps/web/src/workspace/WorkspaceShell.tsx
          grep -q '/channels/@me' apps/web/src/public/PublicApp.tsx
          grep -q 'href="/privacy"' apps/web/src/public/PublicApp.tsx
          grep -q 'href="/terms"' apps/web/src/public/PublicApp.tsx
          grep -q 'pathname === "/admin"' apps/web/src/app/App.tsx
          ! grep -q 'WEB_STATIC' apps/api/main.py
          ! grep -q 'app.mount("/static"' apps/api/main.py
      - name: Build Railway-style production image
        run: docker build --tag operly-frontend-pr .
