name: Manual Agent Runtime Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Raw prompt to send through the objective interpreter
        required: true
        type: string
      scope:
        description: Operly scope used for semantic grounding
        required: true
        default: personal
        type: choice
        options:
          - personal
          - workspace

permissions:
  contents: read

concurrency:
  group: manual-agent-runtime-test-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test-one-request:
    name: Test one request without executing capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPERLY_AGENT_MODEL_PROVIDER: groq
      OPERLY_AGENT_MODEL_ID: openai/gpt-oss-120b
      OPERLY_AGENT_INFERENCE_TIMEOUT_SECONDS: "45"
      OPERLY_AGENT_INFERENCE_MAX_ATTEMPTS: "2"
      TEST_PROMPT: ${{ inputs.prompt }}
      TEST_SCOPE: ${{ inputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Require configured provider
        if: ${{ env.GROQ_API_KEY == '' }}
        run: |
          echo "GROQ_API_KEY is not available to this workflow."
          exit 1

      - name: Test request
        run: |
          python scripts/test_agent_request.py "$TEST_PROMPT" --scope "$TEST_SCOPE"
