name: Federated Identity Contract
on:
  pull_request:
    paths:
      - "apps/api/federated_login.py"
      - "apps/api/session.py"
      - "apps/api/dependencies.py"
      - "apps/api/discord_auth_router.py"
      - "packages/security/identity_handoff.py"
      - "packages/security/native_identity_projection.py"
      - "tests/test_native_identity_projection.py"
      - "tests/test_identity_staged_handoff.py"
      - "packages/security/federated_*.py"
      - "packages/database/federated_*.py"
      - "alembic/versions/0060_*.py"
      - "alembic/versions/0061_*.py"
      - "tests/test_federated_*.py"
      - "tests/test_dragonzpyder_web_sso.py"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/federated-identity.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/federated_login.py"
      - "apps/api/session.py"
      - "apps/api/dependencies.py"
      - "apps/api/discord_auth_router.py"
      - "packages/security/identity_handoff.py"
      - "packages/security/native_identity_projection.py"
      - "tests/test_native_identity_projection.py"
      - "tests/test_identity_staged_handoff.py"
      - "packages/security/federated_*.py"
      - "packages/database/federated_*.py"
      - "alembic/versions/0061_*.py"
      - "tests/test_federated_*.py"
      - "tests/test_dragonzpyder_web_sso.py"
jobs:
  federation-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies and test harness
        run: |
          python -m pip install -r requirements.lock
          python -m pip install pytest pytest-asyncio
      - name: Compile federation and run synthetic account/login contracts
        run: |
          python -m compileall -q apps/api/federated_login.py packages/security/federated_identity.py packages/security/federated_token.py packages/database/federated_identity_models.py packages/database/federated_login_models.py
          python -m pytest -q tests/test_native_identity_projection.py tests/test_federated_session_status.py tests/test_identity_staged_handoff.py tests/test_dragonzpyder_identity_owner.py tests/test_federated_identity_map.py tests/test_federated_token.py tests/test_federated_browser_sso.py tests/test_dragonzpyder_web_sso.py
