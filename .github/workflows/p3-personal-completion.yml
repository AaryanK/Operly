name: P3 Personal Completion

on:
  pull_request:
    paths:
      - "packages/personal_modules/connectors.py"
      - "packages/personal_modules/google_completion_provider.py"
      - "packages/personal_modules/runtime.py"
      - "tests/test_personal_google_completion_provider.py"
      - "tests/test_personal_p3_calendar_draft.py"
      - ".github/workflows/p3-personal-completion.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  p3-personal-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Compile P3 boundaries
        run: |
          python -m py_compile \
            packages/personal_modules/google_completion_provider.py \
            packages/personal_modules/connectors.py \
            packages/personal_modules/runtime.py \
            tests/test_personal_google_completion_provider.py \
            tests/test_personal_p3_calendar_draft.py
      - name: Run P3 contract and entrypoint acceptance tests
        run: |
          python -m unittest tests.test_personal_google_completion_provider -v
          python -m unittest tests.test_personal_p3_calendar_draft -v
