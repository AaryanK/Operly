name: app-identity

on:
  pull_request:
    paths:
      - "packages/app_identity/**"
      - "packages/capabilities/app_identity_provider.py"
      - "packages/capabilities/defaults.py"
      - "packages/coding_harness/source_service.py"
      - "packages/relational_data/bindings.py"
      - "packages/runtime_plugins/app_identity_source_validation.py"
      - "packages/runtime_plugins/fullstack_runtime.py"
      - "apps/api/app_identity_router.py"
      - "apps/api/main.py"
      - "apps/api/system_router.py"
      - "apps/api/workspace_entities_router.py"
      - "apps/runner/__init__.py"
      - "tests/test_app_identity.py"
      - ".github/workflows/app-identity.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r apps/runner/requirements.txt pytest pytest-asyncio
      - name: Compile identity runtime
        run: python -m compileall -q packages/app_identity packages/capabilities/app_identity_provider.py packages/coding_harness/source_service.py packages/runtime_plugins/app_identity_source_validation.py apps/api/app_identity_router.py apps/api/main.py apps/api/workspace_entities_router.py apps/runner
      - name: Diagnose production API route assembly in a fresh interpreter
        run: |
          SESSION_SECRET=identity-ci-session-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
          OPERLY_RUNTIME_BINDING_SECRET=app-identity-ci-runtime-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
          OPERLY_APP_IDENTITY_SECRET=app-identity-ci-session-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
          python - <<'PY'
          from apps.api.app_identity_router import admin_router, runtime_router
          from apps.api.main import app
          from apps.api.workspace_entities_router import router as entity_router

          expected = {
              "/api/runtime/app-identity/register",
              "/api/runtime/app-identity/login",
              "/api/app-identities/{application_id}/invitations",
              "/api/runtime/entities/schema",
          }
          before = {getattr(route, "path", "") for route in app.routes}
          missing_before = sorted(expected - before)
          if missing_before:
              app.include_router(runtime_router)
              app.include_router(admin_router)
              app.include_router(entity_router)
          after = {getattr(route, "path", "") for route in app.routes}
          missing_after = sorted(expected - after)
          assert not missing_before, {
              "missing_before": missing_before,
              "manual_include_fixed_it": not missing_after,
              "missing_after_manual_include": missing_after,
              "runtime_router": sorted(getattr(route, "path", "") for route in runtime_router.routes),
              "admin_router": sorted(getattr(route, "path", "") for route in admin_router.routes),
              "entity_router": sorted(getattr(route, "path", "") for route in entity_router.routes),
          }
          PY
      - name: Run identity and shared-data acceptance tests
        env:
          OPERLY_RUNTIME_BINDING_SECRET: app-identity-ci-runtime-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          OPERLY_APP_IDENTITY_SECRET: app-identity-ci-session-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: python -m pytest -q tests/test_app_identity.py tests/test_workspace_entity_graph.py tests/test_relational_data_primitive.py
