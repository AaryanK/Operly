name: runtime-hardening

on:
  pull_request:
    paths:
      - "apps/api/main.py"
      - "apps/api/agent_router.py"
      - "apps/api/runtime_trace_router.py"
      - "packages/actions/lifecycle.py"
      - "packages/actions/service.py"
      - "packages/agents/**"
      - "packages/business_brain/agent.py"
      - "packages/business_brain/context_loader.py"
      - "packages/business_brain/personal_agent.py"
      - "packages/capabilities/agent_harness.py"
      - "packages/capabilities/calendar_semantics_provider.py"
      - "packages/capabilities/context_provider.py"
      - "packages/capabilities/defaults.py"
      - "packages/capabilities/discovery_provider.py"
      - "packages/capabilities/firewall.py"
      - "packages/capabilities/gmail_read_provider.py"
      - "packages/capabilities/scope_provider.py"
      - "packages/capabilities/search_index.py"
      - "packages/capabilities/session_view.py"
      - "packages/capabilities/validation.py"
      - "packages/capabilities/workflow_contracts.py"
      - "packages/connectors/discord/task_delivery.py"
      - "packages/context/**"
      - "packages/database/company_models.py"
      - "packages/database/models.py"
      - "packages/database/model_trace.py"
      - "packages/database/model_trace_models.py"
      - "packages/database/runtime_trace_events.py"
      - "packages/database/schema.py"
      - "packages/model_runtime/**"
      - "packages/retrieval/**"
      - "packages/security/execution_context.py"
      - "packages/security/scope_resolver.py"
      - "packages/security/surfaces.py"
      - "packages/tasks/delivery.py"
      - "packages/tasks/runtime.py"
      - "requirements.txt"
      - "alembic/versions/0034_provider_trace_ids.py"
      - "alembic/versions/0035_conversation_runtime_trace.py"
      - "alembic/versions/0039_scope_aware_actions.py"
      - "tests/test_agent_runtime_hardening.py"
      - "tests/test_assistant_first_personal_dm.py"
      - "tests/test_authority_boundaries.py"
      - "tests/test_capability_exposure_reliability.py"
      - "tests/test_model_requirements.py"
      - "tests/test_model_request_failover.py"
      - "tests/test_model_tool_continuation_adapters.py"
      - "tests/test_runtime_contract_hardening.py"
      - "tests/test_runtime_retrieval_security.py"
      - "tests/test_runtime_trace_contract.py"
      - "tests/test_runtime_trace_access.py"
      - "tests/test_semantic_runtime_foundations.py"
      - "tests/test_truthful_execution_response.py"
      - "tests/test_personal_execution_scope.py"
      - "tests/test_account_scope_resolver.py"
      - "tests/test_scope_aware_actions.py"
      - ".github/workflows/runtime-hardening.yml"
  workflow_dispatch:

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile hardened runtime
        run: >-
          python -m py_compile
          apps/api/main.py
          apps/api/agent_router.py
          apps/api/runtime_trace_router.py
          packages/actions/lifecycle.py
          packages/actions/service.py
          packages/agents/runtime.py
          packages/agents/controller.py
          packages/agents/planning.py
          packages/agents/run_state.py
          packages/business_brain/agent.py
          packages/business_brain/context_loader.py
          packages/business_brain/personal_agent.py
          packages/capabilities/agent_harness.py
          packages/capabilities/calendar_semantics_provider.py
          packages/capabilities/context_provider.py
          packages/capabilities/defaults.py
          packages/capabilities/discovery_provider.py
          packages/capabilities/firewall.py
          packages/capabilities/gmail_read_provider.py
          packages/capabilities/scope_provider.py
          packages/capabilities/search_index.py
          packages/capabilities/session_view.py
          packages/capabilities/validation.py
          packages/capabilities/workflow_contracts.py
          packages/connectors/discord/task_delivery.py
          packages/context/broker.py
          packages/context/service.py
          packages/database/company_models.py
          packages/database/models.py
          packages/database/model_trace.py
          packages/database/model_trace_models.py
          packages/database/runtime_trace_events.py
          packages/database/schema.py
          packages/model_runtime/conversation_policy.py
          packages/model_runtime/requirements.py
          packages/model_runtime/registry.py
          packages/model_runtime/routing_policy.py
          packages/model_runtime/service.py
          packages/model_runtime/task_routing.py
          packages/model_runtime/trace_context.py
          packages/model_runtime/trace_events.py
          packages/model_runtime/ollama_client.py
          packages/model_runtime/openrouter_client.py
          packages/model_runtime/openai_compatible_client.py
          packages/retrieval/semantic.py
          packages/security/execution_context.py
          packages/security/scope_resolver.py
          packages/security/surfaces.py
          packages/tasks/delivery.py
          packages/tasks/runtime.py
          alembic/versions/0034_provider_trace_ids.py
          alembic/versions/0035_conversation_runtime_trace.py
          alembic/versions/0039_scope_aware_actions.py
      - name: Run runtime hardening regressions
        env:
          ADMIN_PASSWORD: test-admin-password-1234
          SESSION_SECRET: test-session-secret-that-is-long-enough
          AUTH_TOKEN_PEPPER: test-auth-token-pepper-that-is-long-enough
          OPERLY_ENV: test
          OPERLY_SEMANTIC_EMBEDDING_BACKEND: hashing
          OPERLY_PLANNING_MODE: deterministic_test
        run: >-
          python -m pytest -q
          tests/test_agent_runtime_hardening.py
          tests/test_assistant_first_personal_dm.py
          tests/test_authority_boundaries.py
          tests/test_capability_exposure_reliability.py
          tests/test_model_requirements.py
          tests/test_model_request_failover.py
          tests/test_model_tool_continuation_adapters.py
          tests/test_runtime_contract_hardening.py
          tests/test_runtime_retrieval_security.py
          tests/test_runtime_trace_contract.py
          tests/test_runtime_trace_access.py
          tests/test_semantic_runtime_foundations.py
          tests/test_truthful_execution_response.py
          tests/test_personal_execution_scope.py
          tests/test_account_scope_resolver.py
          tests/test_scope_aware_actions.py
      - name: Verify migration chain on SQLite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./runtime-hardening.db
          OPERLY_AUTO_MIGRATE: "false"
        run: |
          rm -f ./runtime-hardening.db ./runtime-hardening.db-*
          python -m packages.database.migrate upgrade
