name: model-qualification

on:
  pull_request:
    paths:
      - "packages/model_runtime/qualification_benchmark.py"
      - "scripts/benchmark_models.py"
      - "tests/test_model_qualification_benchmark.py"
      - "docs/model-qualification.md"
      - ".github/workflows/model-qualification.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile qualification harness
        run: >-
          python -m py_compile
          packages/model_runtime/qualification_benchmark.py
          scripts/benchmark_models.py
      - name: Run qualification contracts
        env:
          OPERLY_ENV: test
          ADMIN_PASSWORD: test-admin-password-1234
          SESSION_SECRET: test-session-secret-that-is-long-enough
          AUTH_TOKEN_PEPPER: test-auth-token-pepper-that-is-long-enough
        run: python -m pytest -q tests/test_model_qualification_benchmark.py
