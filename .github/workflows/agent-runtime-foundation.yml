name: Agent Runtime Foundation

on:
  pull_request:
    paths:
      - "packages/agent_runtime/**"
      - "tests/test_agent_runtime_foundation.py"
      - "docs/unified-agent-runtime.md"
      - ".github/workflows/agent-runtime-foundation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  foundation:
    name: Governed agent foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Compile foundation
        run: |
          python -m py_compile \
            packages/agent_runtime/__init__.py \
            packages/agent_runtime/contracts.py \
            packages/agent_runtime/runtime.py \
            tests/test_agent_runtime_foundation.py
      - name: Run foundation adversarial tests
        run: python -m unittest tests.test_agent_runtime_foundation -v
