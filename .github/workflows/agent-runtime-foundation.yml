name: Agent Runtime Foundation

on:
  pull_request:
    paths:
      - "packages/agent_runtime/**"
      - "packages/database/agent_runtime_models.py"
      - "packages/database/schema.py"
      - "alembic/versions/0057_agent_runtime_foundation.py"
      - "tests/test_agent_runtime_foundation.py"
      - "tests/test_agent_runtime_planner.py"
      - "tests/test_agent_runtime_store.py"
      - "tests/test_agent_runtime_orchestrator.py"
      - "tests/test_agent_runtime_races.py"
      - "tests/test_agent_runtime_uncertain.py"
      - "docs/unified-agent-runtime.md"
      - "docs/agent-runtime-planner-safety.md"
      - ".github/workflows/agent-runtime-foundation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  foundation:
    name: Governed agent foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Compile foundation
        run: |
          python -m py_compile \
            packages/agent_runtime/__init__.py \
            packages/agent_runtime/contracts.py \
            packages/agent_runtime/planner.py \
            packages/agent_runtime/runtime.py \
            packages/agent_runtime/store.py \
            packages/agent_runtime/orchestrator.py \
            packages/database/agent_runtime_models.py \
            packages/database/schema.py \
            alembic/versions/0057_agent_runtime_foundation.py \
            tests/test_agent_runtime_foundation.py \
            tests/test_agent_runtime_planner.py \
            tests/test_agent_runtime_store.py \
            tests/test_agent_runtime_orchestrator.py \
            tests/test_agent_runtime_races.py \
            tests/test_agent_runtime_uncertain.py
      - name: Run foundation adversarial tests
        run: |
          python -m unittest tests.test_agent_runtime_foundation -v
          python -m unittest tests.test_agent_runtime_planner -v
          python -m unittest tests.test_agent_runtime_store -v
          python -m unittest tests.test_agent_runtime_orchestrator -v
          python -m unittest tests.test_agent_runtime_races -v
          python -m unittest tests.test_agent_runtime_uncertain -v
      - name: Validate clean database migration
        run: |
          rm -f /tmp/operly-agent-runtime-foundation.db
          DATABASE_URL=sqlite+aiosqlite:////tmp/operly-agent-runtime-foundation.db \
            python -m packages.database.migrate upgrade
