name: DigitalEvent Workflow Bridge

on:
  pull_request:
    paths:
      - ".github/workflows/digital-event-workflow-bridge.yml"
      - "packages/plugins/events.py"
      - "packages/plugins/webhooks.py"
      - "packages/plugins/webhook_router.py"
      - "packages/database/kernel_models.py"
      - "packages/database/plugin_platform_models.py"
      - "packages/workflow/**"
      - "tests/test_digital_event_workflow_bridge.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/digital-event-workflow-bridge.yml"
      - "packages/plugins/events.py"
      - "packages/plugins/webhooks.py"
      - "packages/plugins/webhook_router.py"
      - "packages/database/kernel_models.py"
      - "packages/database/plugin_platform_models.py"
      - "packages/workflow/**"
      - "tests/test_digital_event_workflow_bridge.py"

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite+aiosqlite:///./digital-event-workflow-bridge.db
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "SQLAlchemy>=2.0,<3" "aiosqlite>=0.20,<1"

      - name: Compile bridge surfaces
        run: |
          python -m py_compile packages/plugins/events.py
          python -m py_compile tests/test_digital_event_workflow_bridge.py

      - name: Run DigitalEvent to Workflow integration tests
        run: python -m unittest discover -s tests -p "test_digital_event_workflow_bridge.py" -v
