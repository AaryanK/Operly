name: Real-world Objective Evaluation

on:
  pull_request:
    paths:
      - "packages/agent_runtime/real_world_evaluation.py"
      - "packages/agent_runtime/real_world_evaluation_extra.py"
      - "scripts/evaluate_real_world_objectives.py"
      - "tests/test_agent_runtime_real_world_evaluation.py"
      - ".github/workflows/real-world-objective-eval.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus-contract:
    name: Exhaustive current capability corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Compile benchmark
        run: |
          python -m py_compile \
            packages/agent_runtime/real_world_evaluation.py \
            packages/agent_runtime/real_world_evaluation_extra.py \
            scripts/evaluate_real_world_objectives.py \
            tests/test_agent_runtime_real_world_evaluation.py
      - name: Validate corpus coverage
        run: |
          python -m unittest tests.test_agent_runtime_real_world_evaluation -v
          python scripts/evaluate_real_world_objectives.py --inventory-only

  live-model:
    name: Live production-model raw prompts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPERLY_AGENT_MODEL_PROVIDER: groq
      OPERLY_AGENT_MODEL_ID: openai/gpt-oss-120b
      OPERLY_AGENT_INFERENCE_TIMEOUT_SECONDS: "45"
      OPERLY_AGENT_INFERENCE_MAX_ATTEMPTS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Explain unavailable live provider
        if: ${{ env.GROQ_API_KEY == '' }}
        run: |
          echo "LIVE_MODEL_EVAL_SKIPPED: GROQ_API_KEY is not available to this GitHub Actions run."
          echo "The exhaustive corpus contract still runs, but this job cannot claim live model accuracy."
      - name: Run live raw-prompt matrix
        if: ${{ env.GROQ_API_KEY != '' }}
        run: |
          python scripts/evaluate_real_world_objectives.py \
            --interval 0.75 \
            --max-attempts 3 \
            --retry-delay 3 \
            --output-dir artifacts/real-world-objective-eval
