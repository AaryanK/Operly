name: application-flow

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/actions/**"
      - "packages/business/**"
      - "packages/business_brain/**"
      - "packages/capabilities/**"
      - "packages/connectors/**"
      - "packages/workspace/**"
      - "tests/test_authentication.py"
      - "tests/test_capability_harness_journey.py"
      - "tests/test_company_intelligence.py"
      - "tests/test_company_operating_system.py"
      - ".github/workflows/application-flow.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile application flow
        run: >-
          python -m py_compile
          apps/api/main.py
          apps/api/business.py
          apps/api/company_router.py
          apps/api/workspace_router.py
          apps/api/approvals_router.py
          apps/api/integrations_router.py
          apps/api/system_router.py
          packages/business/service.py
          packages/workspace/service.py
          packages/business_brain/agent.py
          packages/capabilities/agent_harness.py
          packages/capabilities/defaults.py
          packages/capabilities/business_provider.py
          packages/capabilities/workspace_provider.py
          packages/capabilities/operations_provider.py
          packages/capabilities/studio_provider.py
      - name: Run application-flow tests
        env:
          ADMIN_PASSWORD: test-admin-password-1234
          SESSION_SECRET: test-session-secret-that-is-long-enough
          OPERLY_ENV: test
        run: >-
          python -m pytest -q
          tests/test_authentication.py
          tests/test_capability_harness_journey.py
          tests/test_company_intelligence.py
          tests/test_company_operating_system.py
