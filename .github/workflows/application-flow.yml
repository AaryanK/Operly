name: application-flow

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/runner/**"
      - "apps/web/**"
      - "alembic/versions/**"
      - "packages/actions/**"
      - "packages/agents/**"
      - "packages/business/**"
      - "packages/business_brain/**"
      - "packages/capabilities/**"
      - "packages/channels/**"
      - "packages/company/**"
      - "packages/connectors/**"
      - "packages/context/**"
      - "packages/database/**"
      - "packages/mcp/**"
      - "packages/model_runtime/**"
      - "packages/plugins/**"
      - "packages/runtime_plugins/**"
      - "packages/service_bindings/**"
      - "packages/security/**"
      - "packages/software_projects/**"
      - "packages/solutions/**"
      - "packages/workspace/**"
      - "packages/workspace_entities/**"
      - "tests/test_canonical_software_architecture.py"
      - "tests/test_software_project_persistence.py"
      - "tests/test_software_build_capability.py"
      - "tests/test_generated_solution_worker.py"
      - "tests/test_fullstack_runtime_contract.py"
      - "tests/test_solution_source_inspector.py"
      - "tests/test_solution_production.py"
      - "tests/test_solutions.py"
      - "tests/test_unified_agent_runtime_foundation.py"
      - "tests/test_plugin_first_runtime.py"
      - "tests/test_runtime_trace_contract.py"
      - ".github/workflows/application-flow.yml"
      - "requirements.txt"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Enforce canonical software architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -d packages/custom_software
          test ! -d packages/coding_harness
          test ! -d packages/studio
          test ! -d packages/application_builder
          test ! -d packages/dashboard_studio
          if grep -R --line-number --include='*.py' -E 'packages\.(custom_software|coding_harness|studio|application_builder|dashboard_studio)(\.| import )' apps packages; then
            echo "Historical implementation namespace remains in executable source" >&2
            exit 1
          fi
          test -d packages/software_projects/planning
          test -d packages/software_projects/coding
          test -f packages/runtime_plugins/runner_contracts.py
          test -f packages/runtime_plugins/interaction_contracts.py

      - name: Compile canonical application runtime
        run: >-
          python -m compileall -q
          apps/api
          apps/runner
          packages/agents
          packages/capabilities
          packages/model_runtime
          packages/runtime_plugins
          packages/software_projects
          packages/solutions

      - name: Check current browser JavaScript syntax
        run: |
          set -euo pipefail
          find apps/web/static -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check

      - name: Run canonical application-flow contracts
        env:
          ADMIN_PASSWORD: test-admin-password-1234
          SESSION_SECRET: test-session-secret-that-is-long-enough
          AUTH_TOKEN_PEPPER: test-auth-token-pepper-that-is-long-enough
          OPERLY_ENV: test
        run: >-
          python -m pytest -q
          tests/test_canonical_software_architecture.py
          tests/test_software_project_persistence.py
          tests/test_software_build_capability.py
          tests/test_generated_solution_worker.py
          tests/test_fullstack_runtime_contract.py
          tests/test_solution_source_inspector.py
          tests/test_solution_production.py
          tests/test_solutions.py
          tests/test_unified_agent_runtime_foundation.py
          tests/test_plugin_first_runtime.py
          tests/test_runtime_trace_contract.py
          tests/test_capability_surface_parity.py
          tests/test_workspace_security_boundary.py

      - name: Smoke Railway-style production startup
        env:
          OPERLY_ENV: production
          DATABASE_URL: sqlite+aiosqlite:///./ci-railway-smoke.db
          SESSION_SECRET: ci-session-secret-that-is-long-and-unique
          AUTH_TOKEN_PEPPER: ci-auth-token-pepper-that-is-over-thirty-two-bytes
          RAILWAY_PUBLIC_DOMAIN: smoke.operly.test
          OPERLY_AUTO_MIGRATE: "false"
        run: |
          rm -f ./ci-railway-smoke.db ./ci-railway-smoke.db-*
          python -m packages.database.migrate upgrade --allow-production
          uvicorn apps.api.main:app --host 127.0.0.1 --port 8765 >/tmp/operly-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -H 'Host: smoke.operly.test' http://127.0.0.1:8765/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/operly-smoke.log
          exit 1
