name: application-flow

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/src/**"
      - "apps/web/scripts/**"
      - "apps/web/package.json"
      - "alembic/versions/**"
      - "packages/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/application-flow.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Compile current application flow
        run: >-
          python -m compileall -q
          apps/api
          alembic/versions
          packages/actions
          packages/agents
          packages/business
          packages/business_brain
          packages/capabilities
          packages/channels
          packages/company
          packages/connectors
          packages/context
          packages/coding_harness
          packages/custom_software
          packages/database
          packages/mcp
          packages/model_runtime
          packages/plugins
          packages/runtime_plugins
          packages/security
          packages/solutions
          packages/workspace

      - name: Verify canonical React frontend contracts
        run: node apps/web/scripts/frontend-contract.mjs

      - name: Run application-flow tests
        env:
          ADMIN_PASSWORD: test-admin-password-1234
          SESSION_SECRET: test-session-secret-that-is-long-enough
          AUTH_TOKEN_PEPPER: test-auth-token-pepper-that-is-long-enough
          OPERLY_ENV: test
        run: >-
          python -m pytest -q --junitxml=application-flow.xml
          tests/test_account_scope_workspace_creation.py
          tests/test_authentication.py
          tests/test_railway_auth_origin.py
          tests/test_capability_harness_journey.py
          tests/test_capability_exposure_reliability.py
          tests/test_capability_surface_parity.py
          tests/test_channel_context.py
          tests/test_channel_attachment_ingress.py
          tests/test_connector_presentation_tools.py
          tests/test_dm_workspace_switch.py
          tests/test_space_binding_transfer.py
          tests/test_connector_runtime.py
          tests/test_company_intelligence.py
          tests/test_company_operating_system.py
          tests/test_company_evidence_provenance_resolution.py
          tests/test_google_workspace_capabilities.py
          tests/test_unified_application_flow.py
          tests/test_workspace_security_boundary.py
          tests/test_principal_access_architecture.py
          tests/test_unified_runtime_context.py
          tests/test_durable_runtime_state.py
          tests/test_plugin_first_runtime.py
          tests/test_multi_provider_model_portfolio.py
          tests/test_openai_compatible_tool_arguments.py
          tests/test_harness_native_tasks.py

      - name: Upload application flow failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-flow-junit
          path: application-flow.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Smoke Railway-style production startup
        env:
          OPERLY_ENV: production
          DATABASE_URL: sqlite+aiosqlite:///./ci-railway-smoke.db
          SESSION_SECRET: ci-session-secret-that-is-long-and-unique
          AUTH_TOKEN_PEPPER: ci-auth-token-pepper-that-is-over-thirty-two-bytes
          RAILWAY_PUBLIC_DOMAIN: smoke.operly.test
          OPERLY_AUTO_MIGRATE: "false"
        run: |
          rm -f ./ci-railway-smoke.db ./ci-railway-smoke.db-*
          python -m packages.database.migrate upgrade --allow-production
          uvicorn apps.api.main:app --host 127.0.0.1 --port 8765 >/tmp/operly-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -H 'Host: smoke.operly.test' http://127.0.0.1:8765/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/operly-smoke.log
          exit 1
