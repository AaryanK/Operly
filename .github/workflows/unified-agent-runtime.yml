name: unified-agent-runtime

on:
  pull_request:
    paths:
      - "apps/api/agent_router.py"
      - "apps/api/personal_agent_router.py"
      - "apps/api/artifact_router.py"
      - "apps/api/system_router.py"
      - "apps/sandbox_runner/**"
      - "apps/web/src/account/PersonalHome.tsx"
      - "apps/web/src/workspace/WorkspaceOperly.tsx"
      - "apps/web/src/ui/artifactDownload.ts"
      - "packages/actions/policy.py"
      - "packages/agent_computer/**"
      - "packages/agents/**"
      - "packages/artifacts/**"
      - "packages/business_brain/agent.py"
      - "packages/business_brain/factory_runtime.py"
      - "packages/business_brain/attachments/**"
      - "packages/capabilities/artifact_provider.py"
      - "packages/capabilities/computer_provider.py"
      - "packages/capabilities/file_runtime_provider.py"
      - "packages/capabilities/file_authoring_provider.py"
      - "packages/capabilities/gmail_artifact_provider.py"
      - "packages/capabilities/personal_google_provider.py"
      - "packages/capabilities/defaults.py"
      - "packages/capabilities/contracts.py"
      - "packages/channels/envelope.py"
      - "packages/channels/service.py"
      - "packages/connectors/discord/**"
      - "packages/database/artifact_models.py"
      - "packages/database/schema.py"
      - "packages/connectors/google_provider.py"
      - "packages/security/execution_context.py"
      - "packages/security/permissions.py"
      - "packages/coding_harness/execution_loop.py"
      - "packages/coding_harness/contract_guidance.py"
      - "packages/coding_harness/objective_audit.py"
      - "packages/coding_harness/studio_controller.py"
      - "requirements.txt"
      - "alembic/versions/0041_agent_artifacts.py"
      - "tests/test_action_effect_policy.py"
      - "tests/test_agent_factory_bindings.py"
      - "tests/test_agent_factory_compiler_efficiency.py"
      - "tests/test_agent_factory_control_plane.py"
      - "tests/test_agent_factory_distribution_resume.py"
      - "tests/test_agent_factory_root_budget.py"
      - "tests/test_agent_factory_safe_routing.py"
      - "tests/test_agent_factory_worker_adapter.py"
      - "tests/test_factory_ai_debug_observability.py"
      - "tests/test_factory_pseudo_intent_discovery.py"
      - "tests/test_factory_grounded_recovery.py"
      - "tests/test_artifact_delivery.py"
      - "tests/test_discord_artifact_delivery.py"
      - "tests/test_file_runtime_provider.py"
      - "tests/test_unified_agent_artifact_runtime.py"
      - "tests/test_agent_computer_storage_ingress_resume.py"
      - "tests/test_agent_objective_verification.py"
      - "tests/test_capability_rescue.py"
      - "tests/test_file_authoring_provider.py"
      - "tests/test_gmail_artifact_provider.py"
      - "tests/test_coding_harness_execution_loop.py"
      - "tests/test_studio_agent_generation.py"
      - "tests/test_studio_agent_controller.py"
      - "tests/test_studio_real_capability_contracts.py"
      - ".github/workflows/unified-agent-runtime.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile unified runtime
        run: |
          python -m compileall -q packages/agents/control_plane
          python -m py_compile \
            apps/api/agent_router.py \
            apps/api/personal_agent_router.py \
            apps/api/artifact_router.py \
            apps/api/system_router.py \
            packages/actions/policy.py \
            packages/agent_computer/runner_client.py \
            packages/agents/capability_rescue.py \
            packages/agents/controller.py \
            packages/agents/persistence.py \
            packages/agents/run_state.py \
            packages/agents/verification.py \
            packages/artifacts/blob_store.py \
            packages/artifacts/delivery.py \
            packages/artifacts/service.py \
            packages/business_brain/agent.py \
            packages/business_brain/factory_runtime.py \
            packages/business_brain/attachments/batch_processor.py \
            packages/capabilities/artifact_provider.py \
            packages/capabilities/computer_provider.py \
            packages/capabilities/contracts.py \
            packages/capabilities/file_runtime_provider.py \
            packages/capabilities/file_authoring_provider.py \
            packages/capabilities/gmail_artifact_provider.py \
            packages/capabilities/personal_google_provider.py \
            packages/channels/envelope.py \
            packages/channels/service.py \
            packages/connectors/discord/artifact_delivery.py \
            packages/connectors/discord/secure_runtime.py \
            packages/database/artifact_models.py \
            packages/database/schema.py \
            packages/coding_harness/execution_loop.py \
            packages/coding_harness/contract_guidance.py \
            packages/coding_harness/objective_audit.py \
            packages/coding_harness/studio_controller.py \
            alembic/versions/0041_agent_artifacts.py
      - name: Test shared Railway Sandbox computer contracts
        working-directory: apps/sandbox_runner
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Verify migration reaches head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./unified-agent-runtime-ci.db
        run: python -m alembic upgrade head
      - name: Run unified runtime and Studio construction acceptance tests
        env:
          OPERLY_ENV: test
          SESSION_SECRET: test-session-secret-that-is-long-enough
          AUTH_TOKEN_PEPPER: test-auth-token-pepper-that-is-long-enough
        run: >-
          python -m pytest -q
          tests/test_action_effect_policy.py
          tests/test_agent_factory_bindings.py
          tests/test_agent_factory_compiler_efficiency.py
          tests/test_agent_factory_control_plane.py
          tests/test_agent_factory_distribution_resume.py
          tests/test_agent_factory_root_budget.py
          tests/test_agent_factory_safe_routing.py
          tests/test_agent_factory_worker_adapter.py
          tests/test_factory_ai_debug_observability.py
          tests/test_factory_pseudo_intent_discovery.py
          tests/test_factory_grounded_recovery.py
          tests/test_artifact_delivery.py
          tests/test_discord_artifact_delivery.py
          tests/test_file_runtime_provider.py
          tests/test_unified_agent_artifact_runtime.py
          tests/test_agent_computer_storage_ingress_resume.py
          tests/test_agent_objective_verification.py
          tests/test_capability_rescue.py
          tests/test_file_authoring_provider.py
          tests/test_gmail_artifact_provider.py
          tests/test_coding_harness_execution_loop.py
          tests/test_studio_agent_generation.py
          tests/test_studio_agent_controller.py
          tests/test_studio_real_capability_contracts.py
