name: Route Traceability

on:
  pull_request:
    paths:
      - ".github/workflows/route-traceability.yml"
      - "apps/api/**"
      - "packages/**/router.py"
      - "packages/**/**_router.py"
      - "packages/kernel/route_traceability.py"
      - "scripts/route_inventory.py"
      - "tests/test_route_traceability.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/route-traceability.yml"
      - "apps/api/**"
      - "packages/**/router.py"
      - "packages/**/**_router.py"
      - "packages/kernel/route_traceability.py"
      - "scripts/route_inventory.py"
      - "tests/test_route_traceability.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_SECRET: route-traceability-ci-secret  # pragma: allowlist secret
      OPERLY_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///./route-traceability.db
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile route traceability contract
        run: |
          python -m py_compile scripts/route_inventory.py
          python -m py_compile packages/kernel/route_traceability.py tests/test_route_traceability.py

      - name: Print current API operation inventory
        run: python scripts/route_inventory.py

      - name: Enforce pinned route classifications
        run: python -m unittest discover -s tests -p "test_route_traceability.py" -v
