name: Workflow Concurrency

on:
  pull_request:
    paths:
      - ".github/workflows/workflow-concurrency.yml"
      - "packages/workflow/**"
      - "packages/kernel/**"
      - "packages/security/**"
      - "packages/database/**"
      - "tests/test_workflow_concurrency.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/workflow-concurrency.yml"
      - "packages/workflow/**"
      - "packages/kernel/**"
      - "packages/security/**"
      - "packages/database/**"
      - "tests/test_workflow_concurrency.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite+aiosqlite:///./workflow-concurrency.db
      SESSION_SECRET: workflow-concurrency-ci-secret  # pragma: allowlist secret
      OPERLY_ENV: development
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compile concurrency surfaces
        run: |
          python -m py_compile packages/workflow/concurrency.py
          python -m py_compile packages/workflow/__init__.py
          python -m py_compile tests/test_workflow_concurrency.py

      - name: Run concurrency policy and trigger-storm tests
        run: python -m unittest discover -s tests -p "test_workflow_concurrency.py" -v

      - name: Re-run Workflow approval regression
        run: python -m unittest discover -s tests -p "test_workflow_approval_rollback_298.py" -v
