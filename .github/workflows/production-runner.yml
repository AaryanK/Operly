name: production-runner

on:
  pull_request:
    paths:
      - "apps/runner/**"
      - "packages/custom_software/__init__.py"
      - "packages/custom_software/runner_contracts.py"
      - "packages/custom_software/source_bundles.py"
      - "packages/runtime_plugins/**"
      - "tests/test_production_runner_service.py"
      - ".github/workflows/production-runner.yml"

jobs:
  docker-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/runner/requirements.txt
      - name: Build trusted job image
        run: docker build -f apps/runner/Dockerfile --target job -t operly-runner-job:test .
      - name: Build trusted proxy image
        run: docker build -f apps/runner/Dockerfile --target proxy -t operly-runner-proxy:test .
      - name: Build runner gateway image
        run: docker build -f apps/runner/Dockerfile --target gateway -t operly-runner-gateway:test .
      - name: Run production isolation acceptance
        env:
          OPERLY_REAL_ISOLATION_RUNNER: "1"
          OPERLY_RUNNER_JOB_IMAGE: operly-runner-job:test
          OPERLY_RUNNER_PROXY_IMAGE: operly-runner-proxy:test
        run: python -m unittest -v tests.test_production_runner_service
      - name: Assert no managed isolation resources leaked
        if: always()
        run: |
          containers="$(docker ps -aq --filter label=operly.runner.managed=true)"
          networks="$(docker network ls -q --filter label=operly.runner.managed=true)"
          images="$(docker images -q --filter label=operly.runner.managed=true)"
          leaked=0
          if [ -n "$containers" ]; then
            echo "Managed containers leaked:" >&2
            docker ps -a --filter label=operly.runner.managed=true
            docker rm -f $containers || true
            leaked=1
          fi
          if [ -n "$networks" ]; then
            echo "Managed networks leaked:" >&2
            docker network ls --filter label=operly.runner.managed=true
            docker network rm $networks || true
            leaked=1
          fi
          if [ -n "$images" ]; then
            echo "Managed temporary runtime images leaked:" >&2
            docker images --filter label=operly.runner.managed=true
            docker image rm -f $images || true
            leaked=1
          fi
          if [ "$leaked" -ne 0 ]; then
            echo "Runner isolation acceptance leaked managed resources" >&2
            exit 1
          fi
