name: canonical-runtime-codemod

on:
  push:
    branches:
      - canonical-runtime-cutover-actual-work-final

permissions:
  contents: write

jobs:
  apply-cutover:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move runtime implementation into canonical namespaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv packages/custom_software packages/software_projects/planning
          git mv packages/coding_harness packages/software_projects/coding

          # Runtime-owned mechanics belong to RuntimePlugin, not planning.
          for file in fullstack_subprocess_runner.py runner_adapters.py runner_contracts.py runner_service.py runtime_profiles.py sandbox.py sandbox_jobs.py; do
            git mv "packages/software_projects/planning/$file" "packages/runtime_plugins/$file"
          done
          rm -f packages/software_projects/planning/source_bundles.py

          # Runtime validation is a RuntimePlugin concern.
          git mv packages/software_projects/coding/interaction_contracts.py packages/runtime_plugins/interaction_contracts.py
          git mv packages/software_projects/coding/runtime_resolution.py packages/runtime_plugins/runtime_resolution.py

          # Historical product/controller surfaces are not implementation mechanics.
          rm -f \
            packages/software_projects/coding/studio_controller.py \
            packages/software_projects/coding/ARCHITECTURE.md \
            packages/software_projects/planning/pack_renderer.py \
            packages/software_projects/planning/packs.py \
            packages/software_projects/planning/renderer.py \
            packages/software_projects/planning/service.py

          mkdir -p packages/agents/hardening
          git mv packages/studio/context_hardening.py packages/agents/hardening/context_hardening.py
          git mv packages/studio/hardening_policy.py packages/agents/hardening/policy.py
          git mv packages/studio/hardening_policy_v2.py packages/agents/hardening/policy_v2.py
          git mv packages/studio/runtime_policy.py packages/agents/hardening/runtime_policy.py
          git mv packages/studio/terminal_recovery.py packages/agents/hardening/terminal_recovery.py
          git mv packages/studio/tool_hardening.py packages/agents/hardening/tool_hardening.py
          git mv packages/studio/model_latency_policy.py packages/model_runtime/model_latency_policy.py
          git mv packages/studio/model_provenance.py packages/model_runtime/model_provenance.py
          git mv packages/studio/design.py packages/software_projects/design.py
          rm -f packages/studio/__init__.py
          rmdir packages/studio

          python - <<'PY'
          from pathlib import Path

          replacements = [
              ("packages.custom_software.source_bundles", "packages.software_projects.source_bundle"),
              ("packages.custom_software.fullstack_subprocess_runner", "packages.runtime_plugins.fullstack_subprocess_runner"),
              ("packages.custom_software.runner_adapters", "packages.runtime_plugins.runner_adapters"),
              ("packages.custom_software.runner_contracts", "packages.runtime_plugins.runner_contracts"),
              ("packages.custom_software.runner_service", "packages.runtime_plugins.runner_service"),
              ("packages.custom_software.runtime_profiles", "packages.runtime_plugins.runtime_profiles"),
              ("packages.custom_software.sandbox_jobs", "packages.runtime_plugins.sandbox_jobs"),
              ("packages.custom_software.sandbox", "packages.runtime_plugins.sandbox"),
              ("packages.custom_software.", "packages.software_projects.planning."),
              ("packages.coding_harness.interaction_contracts", "packages.runtime_plugins.interaction_contracts"),
              ("packages.coding_harness.runtime_resolution", "packages.runtime_plugins.runtime_resolution"),
              ("packages.coding_harness.", "packages.software_projects.coding."),
              ("packages.studio.context_hardening", "packages.agents.hardening.context_hardening"),
              ("packages.studio.hardening_policy_v2", "packages.agents.hardening.policy_v2"),
              ("packages.studio.hardening_policy", "packages.agents.hardening.policy"),
              ("packages.studio.runtime_policy", "packages.agents.hardening.runtime_policy"),
              ("packages.studio.terminal_recovery", "packages.agents.hardening.terminal_recovery"),
              ("packages.studio.tool_hardening", "packages.agents.hardening.tool_hardening"),
              ("packages.studio.model_latency_policy", "packages.model_runtime.model_latency_policy"),
              ("packages.studio.model_provenance", "packages.model_runtime.model_provenance"),
              ("packages.studio.design", "packages.software_projects.design"),
          ]

          roots = [Path("apps"), Path("packages"), Path("tests"), Path("scripts")]
          suffixes = {".py", ".md", ".toml", ".txt"}
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          # New package roots should describe their actual authority.
          Path("packages/agents/hardening/__init__.py").write_text(
              '"""Generic AgentRuntime hardening policies and recovery utilities."""\n', encoding="utf-8"
          )
          PY

          # No executable Python may retain the historical implementation namespaces.
          if grep -R --line-number --include='*.py' -E 'packages\.(custom_software|coding_harness|studio)(\.| import )' apps packages; then
            echo "Historical implementation namespace remains in executable Python" >&2
            exit 1
          fi

          python -m compileall -q apps packages
          git add -A
          git commit -m "Canonicalize software runtime namespaces [canonical-codemod]"
          git push origin HEAD:canonical-runtime-cutover-actual-work-final
