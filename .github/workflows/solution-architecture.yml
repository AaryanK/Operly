name: solution-architecture

on:
  pull_request:
    paths:
      - "alembic/versions/**"
      - "apps/api/security_headers.py"
      - "apps/api/solution_generation_router.py"
      - "apps/api/solutions_router.py"
      - "apps/sandbox_runner/**"
      - "packages/capabilities/solution_provider.py"
      - "packages/capabilities/software_build_provider.py"
      - "packages/database/model_trace.py"
      - "packages/database/product_models.py"
      - "packages/database/software_project_models.py"
      - "packages/model_runtime/trace_context.py"
      - "packages/runtime_plugins/**"
      - "packages/software_projects/**"
      - "packages/solutions/**"
      - "tests/test_canonical_software_architecture.py"
      - "tests/test_solution_manifest.py"
      - "tests/test_solution_initial_generation_lifecycle.py"
      - "tests/test_generated_preview_permissions.py"
      - "tests/test_generated_solution_worker.py"
      - "tests/test_solution_generation_trace_contract.py"
      - "tests/test_runner_async_polling.py"
      - "tests/test_solution_source_inspector.py"
      - "tests/test_solution_production.py"
      - "tests/test_solutions.py"
      - ".github/workflows/solution-architecture.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Compile canonical Solution path
        run: >-
          python -m py_compile
          apps/api/security_headers.py
          apps/api/solution_generation_router.py
          apps/api/solutions_router.py
          packages/capabilities/solution_provider.py
          packages/capabilities/software_build_provider.py
          packages/software_projects/coding/build_service.py
          packages/software_projects/coding/execution_loop.py
          packages/runtime_plugins/runner_adapters.py
          packages/database/model_trace.py
          packages/database/product_models.py
          packages/database/software_project_models.py
          packages/model_runtime/trace_context.py
          packages/solutions/manifest.py
          packages/solutions/composer.py
          packages/solutions/generation_worker.py
          packages/solutions/traced_generation_worker.py
          packages/solutions/service.py

      - name: Validate Railway Sandbox runner
        run: |
          node --check apps/sandbox_runner/core.mjs
          node --check apps/sandbox_runner/server.mjs
          node --test apps/sandbox_runner/core.test.mjs

      - name: Run Solution architecture regressions
        env:
          ADMIN_PASSWORD: test-admin-password-1234
          SESSION_SECRET: test-session-secret-that-is-long-enough
          AUTH_TOKEN_PEPPER: test-auth-token-pepper-that-is-long-enough
          OPERLY_ENV: test
        run: >-
          python -m pytest -q
          tests/test_canonical_software_architecture.py
          tests/test_solution_manifest.py
          tests/test_solution_initial_generation_lifecycle.py
          tests/test_generated_preview_permissions.py
          tests/test_generated_solution_worker.py
          tests/test_solution_generation_trace_contract.py
          tests/test_runner_async_polling.py
          tests/test_solution_source_inspector.py
          tests/test_solution_production.py
          tests/test_solutions.py
