name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  regression:
    name: Security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile hardened Python boundaries
        run: |
          python -m py_compile \
            apps/api/auth_cookies.py \
            apps/api/public_safety.py \
            apps/api/security_headers.py \
            apps/api/mcp_router.py \
            packages/mcp/oauth.py \
            packages/plugins/egress_router.py \
            packages/workspace_modules/tools/__init__.py \
            tests/test_security_hardening.py
      - name: Run exploit regressions
        run: python -m unittest tests.test_security_hardening -v
      - name: Validate Sandbox Runner syntax
        run: node --check apps/sandbox_runner/server.mjs

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Audit Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --strict

  npm-dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit frontend dependency graph
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Audit Sandbox Runner dependency graph
        working-directory: apps/sandbox_runner
        run: |
          npm install --ignore-scripts --package-lock-only
          npm audit --audit-level=high

  secret-diff-scan:
    name: Secret diff scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install secret scanner
        run: python -m pip install detect-secrets==1.5.0
      - name: Reject newly committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR -z "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
              | xargs -0 -r detect-secrets-hook --no-verify
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only --diff-filter=ACMR -z "$before...${{ github.sha }}" \
                | xargs -0 -r detect-secrets-hook --no-verify
            else
              git ls-files -z | xargs -0 -r detect-secrets-hook --no-verify
            fi
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
