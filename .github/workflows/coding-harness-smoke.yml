name: coding-harness-smoke

on:
  push:
    branches: [main]
    paths:
      - "packages/coding_harness/**"
      - "packages/custom_software/live_projection.py"
      - "packages/custom_software/plan_service.py"
      - "packages/custom_software/planning_orchestrator.py"
      - "packages/custom_software/planning_output_normalizer.py"
      - "packages/custom_software/runtime_profiles.py"
      - "packages/custom_software/runner_adapters.py"
      - "packages/custom_software/scope_convergence.py"
      - "packages/custom_software/source_bundles.py"
      - "tests/test_opencode_coding_harness.py"
      - "tests/test_live_plan_projection.py"
      - "tests/test_live_projection_independence.py"
      - "tests/test_planning_output_normalizer.py"
      - "tests/test_scope_convergence.py"
      - "tests/test_coding_harness_runtime_resolution.py"
      - "tests/test_coding_harness_execution_loop.py"
      - ".github/workflows/coding-harness-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: >-
          python -m pytest -q
          tests/test_opencode_coding_harness.py
          tests/test_live_plan_projection.py
          tests/test_live_projection_independence.py
          tests/test_planning_output_normalizer.py
          tests/test_scope_convergence.py
          tests/test_coding_harness_runtime_resolution.py
          tests/test_coding_harness_execution_loop.py
