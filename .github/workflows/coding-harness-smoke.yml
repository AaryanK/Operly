name: coding-harness-smoke

on:
  push:
    branches: [main]
    paths:
      - "packages/coding_harness/**"
      - "packages/custom_software/source_bundles.py"
      - "tests/test_opencode_coding_harness.py"
      - ".github/workflows/coding-harness-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_opencode_coding_harness.py
