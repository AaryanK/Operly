name: workspace-entities

on:
  push:
    branches:
      - main
      - "platform/**"
    paths:
      - "apps/api/workspace_entities_router.py"
      - "apps/api/system_router.py"
      - "apps/runner/**"
      - "packages/workspace_entities/**"
      - "packages/relational_data/tokens.py"
      - "packages/relational_data/bindings.py"
      - "packages/runtime_plugins/fullstack_runtime.py"
      - "packages/capabilities/workspace_entity_provider.py"
      - "packages/capabilities/defaults.py"
      - "tests/test_workspace_entity_graph.py"
      - ".github/workflows/workspace-entities.yml"
  pull_request:
    paths:
      - "apps/api/workspace_entities_router.py"
      - "apps/api/system_router.py"
      - "apps/runner/**"
      - "packages/workspace_entities/**"
      - "packages/relational_data/tokens.py"
      - "packages/relational_data/bindings.py"
      - "packages/runtime_plugins/fullstack_runtime.py"
      - "packages/capabilities/workspace_entity_provider.py"
      - "packages/capabilities/defaults.py"
      - "tests/test_workspace_entity_graph.py"
      - ".github/workflows/workspace-entities.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r apps/runner/requirements.txt pytest pytest-asyncio
      - name: Compile workspace entity runtime
        run: >-
          python -m compileall -q
          apps/api/workspace_entities_router.py
          apps/runner
          packages/workspace_entities
          packages/relational_data/tokens.py
          packages/relational_data/bindings.py
          packages/runtime_plugins/fullstack_runtime.py
          packages/capabilities/workspace_entity_provider.py
      - name: Run workspace entity acceptance tests
        run: python -m pytest -q tests/test_workspace_entity_graph.py tests/test_relational_data_primitive.py tests/test_relational_runner_binding.py
