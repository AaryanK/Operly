name: capability-sandbox

on:
  push:
    branches: [capability-sandbox]
    paths:
      - "packages/capability_sandbox/**"
      - "packages/coding_harness/**"
      - "packages/custom_software/live_planning.py"
      - "packages/custom_software/planning_orchestrator.py"
      - "apps/api/coding_harness_router.py"
      - "apps/web/static/coding-harness-ui.js"
      - "tests/test_capability_target_resolution.py"
      - "tests/test_refinement_scope_routing.py"
      - "tests/test_planning_clarification_gate.py"
      - "tests/test_opencode_coding_harness.py"
      - "tests/test_coding_agent_tool_loop.py"
      - "scripts/run_capability_sandbox.py"
      - ".github/workflows/capability-sandbox.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: >-
          python -m pytest -q
          tests/test_capability_target_resolution.py
          tests/test_refinement_scope_routing.py
          tests/test_planning_clarification_gate.py
          tests/test_opencode_coding_harness.py
          tests/test_coding_agent_tool_loop.py
