name: capability-sandbox

on:
  push:
    branches: [capability-sandbox]
    paths:
      - "packages/capability_sandbox/**"
      - "packages/software_projects/coding/**"
      - "packages/software_projects/planning/**"
      - "packages/runtime_plugins/**"
      - "apps/web/static/graph-planning-ui.js"
      - "apps/web/static/planning-clarification-normal.js"
      - "apps/web/static/planning-clarification.css"
      - "apps/web/static/index.html"
      - "tests/test_capability_target_resolution.py"
      - "tests/test_refinement_scope_routing.py"
      - "tests/test_planning_clarification_gate.py"
      - "tests/test_planning_internal_questions.py"
      - "tests/test_scope_convergence_deterministic_targets.py"
      - "tests/test_graph_planning_efficiency.py"
      - "tests/test_graph_coverage_repair.py"
      - "tests/test_coding_spec_compaction.py"
      - "tests/test_coding_context_window.py"
      - "tests/test_opencode_coding_harness.py"
      - "tests/test_coding_agent_tool_loop.py"
      - "tests/test_capability_harness_journey.py"
      - "scripts/run_capability_sandbox.py"
      - ".github/workflows/capability-sandbox.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile canonical software capability runtime
        run: >-
          python -m py_compile
          packages/software_projects/coding/context_window.py
          packages/software_projects/coding/model_client.py
          packages/software_projects/coding/opencode_agent.py
          packages/software_projects/coding/web_tools.py
          packages/software_projects/coding/source_service.py
          packages/software_projects/planning/graph_planning.py
          packages/software_projects/planning/graph_coverage.py
          packages/software_projects/planning/planning_orchestrator.py
          packages/software_projects/planning/live_projection.py
          packages/software_projects/planning/scope_convergence.py
          packages/runtime_plugins/runner_service.py
      - run: node --check apps/web/static/planning-clarification-normal.js
      - run: node --check apps/web/static/graph-planning-ui.js
      - name: Run capability and software-construction contracts
        run: >-
          python -m pytest -q
          tests/test_capability_target_resolution.py
          tests/test_refinement_scope_routing.py
          tests/test_planning_clarification_gate.py
          tests/test_planning_internal_questions.py
          tests/test_scope_convergence_deterministic_targets.py
          tests/test_graph_planning_efficiency.py
          tests/test_graph_coverage_repair.py
          tests/test_coding_spec_compaction.py
          tests/test_coding_context_window.py
          tests/test_opencode_coding_harness.py
          tests/test_coding_agent_tool_loop.py
          tests/test_capability_harness_journey.py
