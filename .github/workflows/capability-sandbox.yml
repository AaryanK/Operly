name: capability-sandbox

on:
  push:
    branches: [capability-sandbox]
    paths:
      - "packages/capability_sandbox/**"
      - "packages/custom_software/live_planning.py"
      - "tests/test_capability_target_resolution.py"
      - "tests/test_refinement_scope_routing.py"
      - "scripts/run_capability_sandbox.py"
      - ".github/workflows/capability-sandbox.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: >-
          python -m pytest -q
          tests/test_capability_target_resolution.py
          tests/test_refinement_scope_routing.py
