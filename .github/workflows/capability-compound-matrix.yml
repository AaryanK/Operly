name: Capability Compound Workflow Matrix

on:
  pull_request:
    paths:
      - ".github/workflows/capability-compound-matrix.yml"
      - "packages/kernel/**"
      - "packages/personal_modules/**"
      - "packages/workflow/**"
      - "packages/workspace_modules/**"
      - "tests/test_capability_compound_workflow_matrix.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capability-compound-matrix.yml"
      - "packages/kernel/**"
      - "packages/personal_modules/**"
      - "packages/workflow/**"
      - "packages/workspace_modules/**"
      - "tests/test_capability_compound_workflow_matrix.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  capability-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+aiosqlite:///./capability-compound-matrix.db
      SESSION_SECRET: capability-compound-matrix-ci-secret  # pragma: allowlist secret
      OPERLY_ENV: development
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile capability matrix
        run: python -m py_compile tests/test_capability_compound_workflow_matrix.py

      - name: Run capability-wide compound workflows
        run: python -m unittest discover -s tests -p "test_capability_compound_workflow_matrix.py" -v
