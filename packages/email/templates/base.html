<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>$heading</title>
  </head>
  <body style="margin:0;background:#f3f5f1;color:#13231c;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">$preheader</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5f1;padding:24px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #dfe6df;border-radius:18px;overflow:hidden;">
          <tr><td style="background:#102f24;padding:24px 32px;color:#ffffff;font-size:22px;font-weight:800;letter-spacing:.08em;">OPERLY</td></tr>
          <tr><td style="padding:34px 32px 18px;"><h1 style="margin:0;font-size:30px;line-height:1.2;color:#102f24;">$heading</h1></td></tr>
          <tr><td style="padding:0 32px 34px;">$content</td></tr>
          <tr><td style="border-top:1px solid #dfe6df;padding:22px 32px;color:#6e7b74;font-size:12px;line-height:1.6;">This security email was sent by OPERLY. We never ask you to reply with your password or verification code.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
