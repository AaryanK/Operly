services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: operly
      POSTGRES_USER: operly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - operly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operly -d operly"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://operly:${POSTGRES_PASSWORD}@postgres:5432/operly
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: python -m packages.connectors.discord.bot_harness
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://operly:${POSTGRES_PASSWORD}@postgres:5432/operly
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  operly_postgres:
