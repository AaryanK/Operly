<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0a15" />

    <title>OPERLY — Business, operating intelligently.</title>
    <meta
      name="description"
      content="OPERLY — one AI operating layer for every place your customers contact you."
    />
    <link rel="canonical" href="https://operly.dragonzpyder.xyz/" />

    <!-- Open Graph / WhatsApp / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OPERLY" />
    <meta property="og:title" content="OPERLY — Business, operating intelligently." />
    <meta
      property="og:description"
      content="One AI operating layer for every place your customers contact you."
    />
    <meta property="og:url" content="https://operly.dragonzpyder.xyz/" />
    <meta
      property="og:image"
      content="https://operly.dragonzpyder.xyz/operly-logo.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://operly.dragonzpyder.xyz/operly-logo.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="OPERLY logo" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OPERLY — Business, operating intelligently." />
    <meta
      name="twitter:description"
      content="One AI operating layer for every place your customers contact you."
    />
    <meta
      name="twitter:image"
      content="https://operly.dragonzpyder.xyz/operly-logo.png"
    />
    <meta name="twitter:image:alt" content="OPERLY logo" />

    <link rel="icon" type="image/png" href="/operly-logo.png" />
    <link rel="apple-touch-icon" href="/operly-logo.png" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("operly:appearance");
          const preference = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
          const theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#0d0a15");
        } catch (_) { /* use canonical palette defaults */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
