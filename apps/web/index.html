<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <meta
      name="description"
      content="OPERLY — one AI operating layer for every place your customers contact you."
    />
    <link rel="icon" type="image/png" href="/operly-logo.png" />
    <link rel="apple-touch-icon" href="/operly-logo.png" />
    <meta property="og:image" content="/operly-logo.png" />
    <meta name="twitter:image" content="/operly-logo.png" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("operly:appearance");
          const preference = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
          const theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#0b0f18" : "#f4f6fb");
        } catch (_) { /* use light defaults */ }
      })();
    </script>
    <title>OPERLY — Business, operating intelligently.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
