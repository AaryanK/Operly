<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="/static/operly-logo.png">
  <title>Page not found · OPERLY</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 18% 10%,rgba(118,103,245,.28),transparent 34%),radial-gradient(circle at 85% 80%,rgba(164,116,255,.14),transparent 30%),linear-gradient(145deg,#11101a,#191727);color:#f7f4ff}
    main{width:min(680px,100%);padding:42px;border:1px solid #3a3550;border-radius:26px;background:rgba(29,26,43,.92);box-shadow:0 30px 90px rgba(0,0,0,.34)}
    .brand{display:flex;align-items:center;gap:11px;color:#d7d0ff;font-size:12px;font-weight:850;letter-spacing:.14em}
    .brand img{width:34px;height:34px;border-radius:10px;object-fit:cover}
    .code{display:inline-flex;margin-top:30px;padding:6px 10px;border-radius:999px;background:#2d2847;color:#c9c0ff;font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:16px 0 10px;font-size:clamp(40px,8vw,70px);line-height:.98;letter-spacing:-.055em}
    p{max-width:530px;margin:0;color:#aaa3bc;line-height:1.65}
    a{display:inline-flex;margin-top:26px;padding:12px 17px;border-radius:11px;background:#7667f5;color:white;text-decoration:none;font-weight:800;box-shadow:0 8px 24px rgba(118,103,245,.24)}
    a:focus-visible{outline:3px solid #b9b1ff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/static/operly-logo.png" alt=""><span>OPERLY</span></div>
    <span class="code">404 · Not found</span>
    <h1>This page isn’t here.</h1>
    <p>The address does not match an Operly page. We did not fall back to another workspace or the sign-in screen.</p>
    <a href="/">Go to Operly</a>
  </main>
</body>
</html>
